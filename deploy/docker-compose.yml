services:
  backend:
    build:
      context: ../backend
    container_name: dockermgr-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Every value below can be overridden from deploy/.env (copy ../.env.example
      # to .env next to this file); the defaults match .env.example exactly.
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - PORT=${PORT:-8088}
      - TMP_DIR=${TMP_DIR:-/tmp/dockermgr}
      # Fallback registries used when Docker Hub is unreachable.
      # Comma-separated; set to an empty string to disable the fallback.
      # NOTE the single-dash form `${IMAGE_MIRRORS-...}`: `:-` substitutes the
      # default when the variable is unset *or empty*, which silently defeats the
      # documented "leave it empty to disable the fallback" (deployment.md §4.1).
      - IMAGE_MIRRORS=${IMAGE_MIRRORS-docker.m.daocloud.io,docker.1panel.live}
    # Internal only, not exposed to host directly.
    expose:
      - "8088"

  frontend:
    build:
      context: ../frontend
    container_name: dockermgr-frontend
    ports:
      # Bind only to localhost for security (spec C2)
      - "127.0.0.1:8088:80"
    depends_on:
      - backend