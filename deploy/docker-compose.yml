services:
  backend:
    build:
      context: ../backend
    container_name: dockermgr-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PORT=8088
      - TMP_DIR=/tmp/dockermgr
      # Fallback registries used when Docker Hub is unreachable.
      # Comma-separated; set to an empty string to disable the fallback.
      - IMAGE_MIRRORS=${IMAGE_MIRRORS:-docker.m.daocloud.io,docker.1panel.live}
    # Internal only, not exposed to host directly.
    expose:
      - "8088"

  frontend:
    build:
      context: ../frontend
    container_name: dockermgr-frontend
    ports:
      # Bind only to localhost for security (spec C2)
      - "127.0.0.1:8088:80"
    depends_on:
      - backend