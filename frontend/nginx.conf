server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container images are large: pulling one can take minutes and exporting
    # one streams a multi-gigabyte tar. nginx's default 60s proxy_read_timeout
    # used to cut those off with a 504 while the backend was still working.
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Stream bodies through instead of spooling them to disk: exports are big
    # and uploads should reach the backend as they arrive.
    proxy_buffering off;
    proxy_request_buffering off;

    # nginx defaults to 1m, which made copying any file larger than 1MB into
    # a container fail with 413. This deployment is localhost-only.
    client_max_body_size 0;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8088;
        # 1.1 keeps chunked upstream bodies working with request buffering off.
        proxy_http_version 1.1;
        # $http_host, NOT $host: $host drops the port, so FastAPI's trailing-slash
        # redirect came back as `Location: http://127.0.0.1/api/...` - i.e. port
        # 80, where nothing is listening. $http_host keeps the client's Host
        # header (127.0.0.1:8088) intact.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # See the /api/ note above: $host would drop the port.
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
